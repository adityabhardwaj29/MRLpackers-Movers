<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Crisp White Circular Disc -->
  <circle cx="250" cy="250" r="244" fill="#FFFFFF" />

  <!-- Outer Red Ring -->
  <circle cx="250" cy="250" r="236" stroke="#E11D24" stroke-width="18" fill="none" />

  <!-- Inner Black Concentric Ring -->
  <circle cx="250" cy="250" r="212" stroke="#111827" stroke-width="7.5" fill="none" />

  <!-- Dynamic Top Red Speed Arch / Swoosh -->
  <path d="M 120 135 C 180 58, 335 58, 405 130 C 350 90, 205 92, 140 144 Z" fill="#E11D24" />

  <!-- --- MRL LETTERS --- -->
  <!-- 'M' Letter - Slanted Heavy Black -->
  <path d="M 48 254 L 86 130 L 126 130 L 152 205 L 180 130 L 220 130 L 182 254 L 148 254 L 128 196 L 102 254 Z" fill="#111827" />

  <!-- 'R' Letter - Stylized Bright Red -->
  <path d="M 196 254 L 232 130 L 305 130 C 338 130, 356 144, 346 172 C 338 193, 318 204, 290 207 L 324 254 L 282 254 L 258 214 L 244 214 L 232 254 Z M 250 184 L 282 184 C 296 184, 304 178, 307 168 C 310 158, 302 153, 288 153 L 260 153 Z" fill="#E11D24" />

  <!-- 'L' Letter - Slanted Heavy Black -->
  <path d="M 334 254 L 372 130 L 410 130 L 382 222 L 452 222 L 442 254 Z" fill="#111827" />

  <!-- --- MOVING TRUCK SECTION --- -->
  <!-- Red Speed Trail Lines behind Truck Cargo Box -->
  <g fill="#E11D24">
    <rect x="75" y="270" width="105" height="5.5" rx="2.7" />
    <rect x="62" y="282" width="118" height="5.5" rx="2.7" />
    <rect x="52" y="294" width="128" height="5.5" rx="2.7" />
    <rect x="62" y="306" width="118" height="5.5" rx="2.7" />
    <rect x="80" y="318" width="100" height="5.5" rx="2.7" />
    <rect x="95" y="338" width="85" height="5.5" rx="2.7" />
  </g>

  <!-- Black Ground / Road Speed Line -->
  <path d="M 72 342 L 180 342 L 180 338 L 72 338 Z" fill="#111827" />

  <!-- Red Cargo Container -->
  <path d="M 175 262 L 282 262 C 286 262, 289 265, 289 269 L 273 328 L 160 328 L 175 262 Z" fill="#E11D24" />

  <!-- Black Truck Driver Cabin -->
  <path d="M 286 267 L 314 267 L 348 296 L 372 298 C 378 298, 380 300, 380 306 L 376 332 L 272 332 L 286 267 Z" fill="#111827" />

  <!-- White Cabin Windshield -->
  <path d="M 308 274 L 336 294 L 298 294 L 304 274 Z" fill="#FFFFFF" />

  <!-- Front Headlight / Chrome Bumper -->
  <rect x="368" y="306" width="9" height="10" rx="2" fill="#FFFFFF" stroke="#111827" stroke-width="1.5" />

  <!-- Rear Wheel -->
  <circle cx="204" cy="334" r="18" fill="#111827" stroke="#FFFFFF" stroke-width="5" />
  <circle cx="204" cy="334" r="7" fill="#111827" />

  <!-- Front Wheel -->
  <circle cx="340" cy="334" r="18" fill="#111827" stroke="#FFFFFF" stroke-width="5" />
  <circle cx="340" cy="334" r="7" fill="#111827" />

  <!-- --- TEXT: PACKERS AND MOVERS --- -->
  <text x="250" y="392" text-anchor="middle" font-size="35" font-weight="900" font-style="italic" font-family="system-ui, -apple-system, sans-serif, 'Arial Black'" letter-spacing="0.02em" fill="#111827">
    PACKERS <tspan fill="#E11D24">AND</tspan> MOVERS
  </text>

  <!-- --- BOTTOM WINGS & 3 STARS ACCENT --- -->
  <!-- Left Tapered Red Line -->
  <line x1="90" y1="424" x2="195" y2="424" stroke="#E11D24" stroke-width="4" stroke-linecap="round" />

  <!-- Right Tapered Red Line -->
  <line x1="305" y1="424" x2="410" y2="424" stroke="#E11D24" stroke-width="4" stroke-linecap="round" />

  <!-- Left Small Black Star -->
  <polygon points="215,416 217.5,421.5 223,422 218.5,425.5 220,431.5 215,428 210,431.5 211.5,425.5 207,422 212.5,421.5" fill="#111827" />

  <!-- Center Large Red Star -->
  <polygon points="250,411 254,420 264,420.5 256,426.5 259,436.5 250,430 241,436.5 244,426.5 236,420.5 246,420" fill="#E11D24" />

  <!-- Right Small Black Star -->
  <polygon points="285,416 287.5,421.5 293,422 288.5,425.5 290,431.5 285,428 280,431.5 281.5,425.5 277,422 282.5,421.5" fill="#111827" />
</svg>
